<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/salas"></ion-back-button>
    </ion-buttons>
    <ion-title>Entrar em uma Sala</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <form [formGroup]="formGroup" (ngSubmit)="entrar()">

    <div class="campo-grupo">
      <label class="campo-label">Código da sala</label>
      <ion-item class="campo-item" [class.campo-invalido]="campoInvalido('codigoConvite')" lines="none">
        <input type="text" placeholder="Ex: 3A2026" formControlName="codigoConvite" maxlength="20" />
      </ion-item>
      @if (campoInvalido('codigoConvite')) {
      <p class="erro-campo">Digite o código de convite que você recebeu.</p>
      }
    </div>

    <ion-button type="submit" expand="block" class="botao-criar" [disabled]="!formGroup.valid || entrando">
      @if (entrando) { <span class="btn-spinner" aria-hidden="true"></span> Entrando... }
      @else { <ion-icon name="log-in-outline" slot="start"></ion-icon> Entrar na sala }
    </ion-button>

  </form>
</ion-content>
