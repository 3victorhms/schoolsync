<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div class="profile-hero" (click)="editarPerfil()">
    <div class="avatar" [class.tem-foto]="!!usuario.foto">
      <img *ngIf="usuario.foto" [src]="usuario.foto" alt="Foto de perfil de {{ usuario.nome }}">
      <span *ngIf="!usuario.foto">{{ iniciais }}</span>
    </div>
    <div class="hero-info">
      <h2 class="perfil-nome">{{ usuario.nome }}</h2>
      <!-- <p class="perfil-app">EscolaSync</p> -->
    </div>
    <ion-icon name="chevron-forward-outline" class="hero-seta"></ion-icon>
  </div>

  <h3 class="group-title">Preferências</h3>
  <div class="group">
    <button type="button" class="row" (click)="alternarTema()">
      <div class="row-icon laranja">
        <ion-icon [name]="temaClaro ? 'sunny-outline' : 'moon-outline'"></ion-icon>
      </div>
      <div class="row-body">
        <span class="row-label">Tema escuro</span>
      </div>
      <div class="switch" [class.on]="!temaClaro"></div>
    </button>
  </div>

  <h3 class="group-title">Notificações</h3>
  <div class="group">
    <button type="button" class="row" [class.loading]="testandoNotificacaoPush" [disabled]="testandoNotificacaoPush" (click)="testarNotificacao()">
      <div class="row-icon azul">
        <ion-icon name="notifications-outline"></ion-icon>
      </div>
      <div class="row-body">
        <span class="row-label">Testar notificação push</span>
      </div>
      <span class="btn-pill">{{ testandoNotificacaoPush ? 'Enviando...' : 'Testar' }}</span>
    </button>
  </div>

  <h3 class="group-title">Conta</h3>
  <div class="group">
    <button type="button" class="row" (click)="logout()">
      <div class="row-icon cinza">
        <ion-icon name="log-out-outline"></ion-icon>
      </div>
      <div class="row-body">
        <span class="row-label">Sair</span>
      </div>
      <ion-icon name="chevron-forward-outline" class="row-seta"></ion-icon>
    </button>
    <button type="button" class="row destructive" [class.loading]="inativando" [disabled]="inativando" (click)="inativarConta()">
      <div class="row-icon vermelho">
        <ion-icon name="trash-outline"></ion-icon>
      </div>
      <div class="row-body">
        <span class="row-label">{{ inativando ? 'Inativando...' : 'Inativar conta' }}</span>
      </div>
    </button>
  </div>

</ion-content>
