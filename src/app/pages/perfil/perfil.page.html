<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div class="profile-hero" (click)="editarPerfil()">
    <div class="avatar" [class.tem-foto]="!!usuario.foto">
      <img *ngIf="usuario.foto" [src]="usuario.foto" alt="Foto de perfil de {{ usuario.nome }}">
      <span *ngIf="!usuario.foto">{{ iniciais }}</span>
    </div>
    <div class="hero-info">
      <h2 class="perfil-nome">{{ usuario.nome }}</h2>
    </div>
    <ion-icon name="chevron-forward-outline" class="hero-seta"></ion-icon>
  </div>

  <h3 class="group-title">Preferências</h3>
  <div class="group">
    <div class="row tema-row">
      <div class="row-icon laranja">
        <ion-icon [name]="temaClaro ? 'sunny-outline' : 'moon-outline'"></ion-icon>
      </div>
      <div class="row-body">
        <span class="row-label">Tema</span>
      </div>
      <!-- "Sistema" acompanha o modo claro/escuro do celular ou do computador -->
      <div class="tema-opcoes" role="radiogroup" aria-label="Tema do aplicativo">
        @for (opcao of opcoesTema; track opcao.valor) {
        <button type="button" role="radio" [attr.aria-checked]="modoTema === opcao.valor" [class.ativo]="modoTema === opcao.valor"
          (click)="escolherTema(opcao.valor)">
          <ion-icon [name]="opcao.icone" aria-hidden="true"></ion-icon>
          {{ opcao.rotulo }}
        </button>
        }
      </div>
    </div>
  </div>

  <h3 class="group-title">Notificações</h3>
  <div class="group">
    <button type="button" class="row" [class.loading]="testandoNotificacaoPush" [disabled]="testandoNotificacaoPush"
      (click)="testarNotificacao()">
      <div class="row-icon azul">
        <ion-icon name="notifications-outline"></ion-icon>
      </div>
      <div class="row-body">
        <span class="row-label">Testar notificação push</span>
      </div>
      <span class="btn-pill">{{ testandoNotificacaoPush ? 'Enviando...' : 'Testar' }}</span>
    </button>
  </div>

  <!-- no computador o painel e o "Sair" já estão no menu lateral, então somem daqui -->
  @if (usuario.perfil === 'ADMIN') {
  <h3 class="group-title oculto-no-computador">Administração</h3>
  <div class="group oculto-no-computador">
    <button type="button" class="row" routerLink="/admin">
      <div class="row-icon roxo">
        <ion-icon name="shield-checkmark-outline"></ion-icon>
      </div>
      <div class="row-body">
        <span class="row-label">Painel do administrador</span>
      </div>
      <ion-icon name="chevron-forward-outline" class="row-seta"></ion-icon>
    </button>
  </div>
  }

  <h3 class="group-title">Conta</h3>
  <div class="group">
    <button type="button" class="row oculto-no-computador" (click)="logout()">
      <div class="row-icon cinza">
        <ion-icon name="log-out-outline"></ion-icon>
      </div>
      <div class="row-body">
        <span class="row-label">Sair</span>
      </div>
      <ion-icon name="chevron-forward-outline" class="row-seta"></ion-icon>
    </button>
    <button type="button" class="row destructive" [class.loading]="inativando" [disabled]="inativando"
      (click)="inativarConta()">
      <div class="row-icon vermelho">
        <ion-icon name="trash-outline"></ion-icon>
      </div>
      <div class="row-body">
        <span class="row-label">{{ inativando ? 'Inativando...' : 'Inativar conta' }}</span>
      </div>
    </button>
  </div>

</ion-content>
