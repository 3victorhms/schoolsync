<ion-content [fullscreen]="true" class="manutencao-content">
  <main class="manutencao">
    <div class="icone" aria-hidden="true">
      <ion-icon name="construct-outline"></ion-icon>
    </div>
    <h1>Em manutenção</h1>
    <p class="mensagem">{{ mensagem }}</p>
    @if (previsao) {
    <p class="previsao">Previsão de volta: <strong>{{ previsao }}</strong></p>
    }

    <button type="button" class="botao-principal" [disabled]="conferindo" (click)="conferir()">
      @if (conferindo) { <span class="btn-spinner" aria-hidden="true"></span> Conferindo... }
      @else { <ion-icon name="refresh-outline" aria-hidden="true"></ion-icon> Tentar de novo }
    </button>
  </main>
</ion-content>
