<ion-content [fullscreen]="true" class="login-content">

  <div class="login-container">

    <div class="logo-area">

      <div class="logo-icon">
        <ion-icon name="school-outline"></ion-icon>
      </div>

      <h1>SchoolSync</h1>

      <p>
        Organize seus estudos e colabore com sua turma
      </p>

    </div>

    <div class="form-area">

      <h2>Entrar</h2>

      <form [formGroup]="formGroup" (ngSubmit)="autenticar()">

        <ion-input type="email" formControlName="login" placeholder="Email" class="custom-input">
        </ion-input>

        <div class="senha-container">
          <ion-input [type]="mostrarSenha ? 'text' : 'password'" formControlName="senha" placeholder="Senha"
            class="custom-input senha-input" autocomplete="current-password">
          </ion-input>
          <button type="button" class="olho-senha" (click)="mostrarSenha = !mostrarSenha"
            [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'">
            <ion-icon [name]="mostrarSenha ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>

        <ion-button expand="block" type="submit" class="login-button" [disabled]="!formGroup.valid">

          Entrar

          <ion-icon slot="end" name="arrow-forward-outline">
          </ion-icon>

        </ion-button>

      </form>

      <p class="register-text">
        Não tem conta?

        <button type="button" class="register-button" (click)="irCadastrar()">

          Cadastrar

        </button>
      </p>

    </div>

  </div>

</ion-content>
