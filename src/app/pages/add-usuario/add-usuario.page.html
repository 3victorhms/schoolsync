<ion-content [fullscreen]="true" class="login-content">

  <div class="login-container">

    <div class="logo-area">

      <img src="assets/schoolsync-logo-wordmark.svg" alt="SchoolSync" class="logo-mark" />

      <h1>SchoolSync</h1>

      <p>
        Organize seus estudos e colabore com sua turma
      </p>

    </div>

    <div class="form-area">

      <h2>Criar conta</h2>

      <form [formGroup]="formGroup" (ngSubmit)="salvar()">

        <ion-input type="text" formControlName="nome" placeholder="Seu nome" class="custom-input">
        </ion-input>

        <ion-input type="email" formControlName="email" placeholder="Email" class="custom-input">
        </ion-input>

        <div class="senha-container">
          <ion-input [type]="mostrarSenha ? 'text' : 'password'" formControlName="senha" placeholder="Senha"
            class="custom-input senha-input" autocomplete="new-password">
          </ion-input>
          <button type="button" class="olho-senha" (click)="mostrarSenha = !mostrarSenha"
            [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'">
            <ion-icon [name]="mostrarSenha ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>

        <ion-button expand="block" type="submit" class="login-button" [disabled]="formGroup.invalid || salvando">

          {{ salvando ? 'Cadastrando...' : 'Cadastrar' }}

          <ion-icon slot="end" name="arrow-forward-outline">
          </ion-icon>

        </ion-button>

      </form>

      <p class="register-text">
        Já tem conta?

        <button type="button" class="register-button" (click)="irAutenticar()">

          Entrar

        </button>
      </p>

    </div>

  </div>

</ion-content>
