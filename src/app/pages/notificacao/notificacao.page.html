<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio"></ion-back-button>
    </ion-buttons>

    <ion-title>Notificações</ion-title>

    <ion-buttons slot="end">
      <ion-button fill="clear" class="marcar-lidas-btn" (click)="marcarTodas()" aria-label="Marcar todas como lidas">
        <ion-icon name="checkmark-done-outline" slot="icon-only"></ion-icon>
      </ion-button>

      <ion-button fill="clear" routerLink="/notificacao/configuracoes" aria-label="Configurar notificações">
        <ion-icon name="settings-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <main class="pagina-notificacoes">
    <section class="lista" aria-live="polite">
      @if (carregando) { <div class="estado-carregando">Carregando notificações...</div> }
      @if (erro) { <div class="estado-erro" role="alert">{{ erro }}</div> }
      @if (!carregando && !erro && notificacoes.length === 0) {
      <div class="estado-vazio">
        <ion-icon name="notifications-outline"></ion-icon>
        <h2>Nenhuma notificação</h2>
        <p>As novidades sobre suas atividades e grupos aparecerão aqui.</p>
      </div>
      }
      @for (notificacao of notificacoes; track notificacao.id) {
      <button class="notificacao" type="button" [class.nao-lida]="!notificacao.lido" (click)="abrir(notificacao)">
        <span class="icone"><ion-icon [name]="icone(notificacao.tipo)"></ion-icon></span>
        <span class="conteudo">
          <strong>{{ notificacao.titulo }}</strong>
          <span class="mensagem">{{ notificacao.mensagem }}</span>
          <small>{{ formatarHorario(notificacao.horario) }}</small>
        </span>
        @if (!notificacao.lido) { <span class="indicador" aria-label="Não lida"></span> }
      </button>
      }
    </section>
  </main>
</ion-content>
