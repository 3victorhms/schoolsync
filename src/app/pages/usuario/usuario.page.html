<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/perfil"></ion-back-button>
    </ion-buttons>
    <ion-title>Editar Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <form [formGroup]="formGroup" (ngSubmit)="salvar()" autocomplete="off">

    <div class="avatar" [class.tem-foto]="!!usuario.foto">
      <img *ngIf="usuario.foto" [src]="usuario.foto" alt="Prévia da foto de perfil">
      <span *ngIf="!usuario.foto">{{ iniciais }}</span>
    </div>

    <input #inputFoto class="input-foto" type="file" accept="image/*" (change)="selecionarFoto($event)">
    <div class="acoes-foto">
      <ion-button type="button" fill="outline" class="botao-foto" (click)="inputFoto.click()" [disabled]="processandoFoto">
        {{ processandoFoto ? 'Preparando foto...' : (usuario.foto ? 'Trocar foto' : 'Adicionar foto') }}
      </ion-button>
      <ion-button *ngIf="usuario.foto" type="button" fill="clear" class="remover-foto" (click)="removerFoto()" [disabled]="processandoFoto">
        Remover
      </ion-button>
    </div>

    <div class="secao-titulo">Informações</div>

    <div class="campo-grupo">
      <label class="campo-label">Nome</label>
      <ion-item class="campo-item" lines="none">
        <ion-input type="text" placeholder="Seu nome completo" formControlName="nome" autocomplete="off"></ion-input>
      </ion-item>
    </div>

    <div class="campo-grupo">
      <label class="campo-label">E-mail</label>
      <ion-item class="campo-item" lines="none">
        <ion-input type="email" placeholder="seu@email.com" formControlName="email" autocomplete="off"></ion-input>
      </ion-item>
    </div>

    <div class="secao-titulo">Segurança</div>

    <div class="campo-grupo">
      <label class="campo-label">Senha atual</label>
      <ion-item class="campo-item" lines="none">
        <ion-input [type]="mostrarSenhaAtual ? 'text' : 'password'" placeholder="••••••••" formControlName="senhaAtual"
          autocomplete="new-password"></ion-input>
        <ion-button fill="clear" slot="end" class="olho-btn" (click)="mostrarSenhaAtual = !mostrarSenhaAtual"
          [attr.aria-label]="mostrarSenhaAtual ? 'Ocultar senha' : 'Mostrar senha'">
          <ion-icon [name]="mostrarSenhaAtual ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </ion-button>
      </ion-item>
    </div>

    <div class="campo-grupo">
      <label class="campo-label">Nova senha</label>
      <ion-item class="campo-item" lines="none">
        <ion-input [type]="mostrarNovaSenha ? 'text' : 'password'" placeholder="••••••••" formControlName="novaSenha"
          autocomplete="new-password"></ion-input>
        <ion-button fill="clear" slot="end" class="olho-btn" (click)="mostrarNovaSenha = !mostrarNovaSenha"
          [attr.aria-label]="mostrarNovaSenha ? 'Ocultar senha' : 'Mostrar senha'">
          <ion-icon [name]="mostrarNovaSenha ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </ion-button>
      </ion-item>
    </div>

    <div class="campo-grupo">
      <label class="campo-label">Confirmar nova senha</label>
      <ion-item class="campo-item" lines="none">
        <ion-input [type]="mostrarConfirmar ? 'text' : 'password'" placeholder="••••••••"
          formControlName="confirmarSenha" autocomplete="new-password"></ion-input>
        <ion-button fill="clear" slot="end" class="olho-btn" (click)="mostrarConfirmar = !mostrarConfirmar"
          [attr.aria-label]="mostrarConfirmar ? 'Ocultar senha' : 'Mostrar senha'">
          <ion-icon [name]="mostrarConfirmar ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </ion-button>
      </ion-item>
      <p class="campo-erro" *ngIf="senhasDiferentes">As senhas não coincidem</p>
    </div>

    <ion-button type="submit" expand="block" class="botao-salvar"
      [disabled]="!formGroup.valid || senhasDiferentes || semAlteracoes || senhaAtualObrigatoria || processandoFoto || salvando">
      {{ salvando ? 'Salvando...' : 'Salvar alterações' }}
    </ion-button>

  </form>
</ion-content>
